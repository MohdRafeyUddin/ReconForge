name: CI

on:
  push:
    branches: [main, advanced]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URL: mongodb://127.0.0.1:27017
      MONGO_URI: mongodb://127.0.0.1:27017
      DATABASE_NAME: reconforge_ci
      ASSUME_TOOLS_INSTALLED: "true"
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q app

      - name: Run tests
        run: >
          python -m pytest
          tests/test_api_classify.py
          tests/test_cloud_classify.py
          tests/test_body_fetch.py
          tests/test_stage3_content_targeted.py
          tests/test_stage3_screenshots.py
          -q
